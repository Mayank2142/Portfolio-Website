# Free preview deployment. Render's free PostgreSQL expires after 30 days.
# Upgrade the database before using this as a lasting production service.
services:
  - type: web
    name: mayank-gupta-portfolio
    runtime: node
    repo: https://github.com/Mayank2142/Portfolio-Website
    branch: main
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: mayank-portfolio-db
          property: connectionString
      - key: TRUST_PROXY
        value: '1'
      - key: EMAIL_MODE
        value: preview

databases:
  - name: mayank-portfolio-db
    databaseName: portfolio
    user: portfolio
    region: singapore
    plan: free
    ipAllowList: []
